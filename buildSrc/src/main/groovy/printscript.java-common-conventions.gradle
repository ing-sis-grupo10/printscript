import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.Confidence

plugins {
    id 'java'
    id 'checkstyle'
    id 'com.diffplug.spotless'
    id 'com.github.spotbugs'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.test {
    useJUnitPlatform()
}

checkstyle {
    toolVersion = '10.12.5'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

spotless {
    java {
        googleJavaFormat().aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

spotbugs {
    toolVersion = '4.8.6'
    effort.set(Effort.MAX) // regla personalizada, subimos el effort a max (el default es default que es medio)
    reportLevel.set(Confidence.valueOf('LOW')) //regla personalizada, bajamos el reportlevel a low (el default es medium)
    excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
}

tasks.register('installGitHooks', Copy) {
    from("$rootDir/hooks/pre-commit")
    into("$rootDir/.git/hooks")
}
tasks.named('build') {
    dependsOn 'installGitHooks'
}




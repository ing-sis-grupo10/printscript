plugins {
    id 'java-library'
    id 'maven-publish'
    id 'printscript.java-common-conventions'
}

group = 'ar.edu.austral.ingsis.printscript'
version = '1.1.1'

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = "printscript-${project.name}"
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/ing-sis-grupo10/printscript')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

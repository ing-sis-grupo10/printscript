plugins {
    id 'printscript.java-application-conventions'
}

dependencies {
    implementation project(':common')
    implementation project(':ast')
    implementation project(':lexer')
    implementation project(':parser')
    implementation project(':interpreter')
    implementation project(':formatter')
    implementation project(':analyzer')
}

application {
    mainClass = 'printscript.cli.Main'
}

// Main es el punto de entrada: parsea argumentos y delega en Pipeline (que sí está testeado).
// Llama a System.exit, por eso se deja fuera de la medición de cobertura.
tasks.named('jacocoTestCoverageVerification') {
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: ['printscript/cli/Main.class'])
    }))
}

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: gradle-check
        name: Gradle check (compilación, tests, Jacoco, Checkstyle)
        entry: ./gradlew check
        language: system
        pass_filenames: false


